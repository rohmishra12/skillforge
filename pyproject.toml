[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillforge"
version = "0.1.0"
description = "Trace-to-Skill Distillation Engine — synthesize reusable AI skills from execution traces"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "SkillForge Contributors" }]
keywords = ["agentic-ai", "prompt-engineering", "skills", "llm", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
web = [
    "gradio>=4.0",
]
hf = [
    "huggingface-hub>=0.23",
    "datasets>=2.19",
]

[project.scripts]
skillforge = "skillforge.cli.main:cli"

[project.urls]
Homepage = "https://github.com/rohmishra12/skillforge"
Repository = "https://github.com/rohmishra12/skillforge"
Issues = "https://github.com/rohmishra12/skillforge/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["skillforge*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
